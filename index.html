
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="./manifest.json">
    <title>Office Fund & Tender Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        #root:empty::before {
            content: "Initializing Nexus Core...";
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #6366f1;
            font-weight: 600;
            font-size: 1.1rem;
            background: #0f172a;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
      // Global error tracking
      function showError(msg) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0f172a; color:#ef4444; text-align:center; padding:20px; font-family: sans-serif;">' +
            '<i class="fa-solid fa-triangle-exclamation" style="font-size:48px; margin-bottom:20px;"></i>' +
            '<h1 style="font-size:24px; font-weight:bold; margin-bottom:10px; color:white;">Nexus Boot Error</h1>' +
            '<p style="color:#94a3b8; font-size:14px; max-width:400px;">' + msg + '</p>' +
            (window.location.protocol.startsWith('content') || window.location.protocol.startsWith('file') ? 
             '<div style="margin-top:20px; color:#f59e0b; font-size:12px; border:1px solid #f59e0b; padding:10px; border-radius:8px;">' +
             '<b>Restriction:</b> Modern web apps cannot run directly from local file explorers. Use a web server or install the app as a PWA.</div>' : '') +
            '<button onclick="location.reload()" style="margin-top:20px; background:#4f46e5; color:white; border:none; padding:12px 24px; border-radius:10px; cursor:pointer; font-weight:bold;">Retry Boot</button>' +
            '</div>';
        }
      }

      window.onerror = function(msg) { showError(msg); };
      window.onunhandledrejection = function(e) { showError(e.reason || "Async process failed"); };

      // Initialize global process environment
      window.process = window.process || { env: { API_KEY: '' } };
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react/": "https://esm.sh/react@19.0.0/",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/": "https://esm.sh/react-dom@19.0.0/",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "recharts": "https://esm.sh/recharts@2.15.0",
        "@google/genai": "https://esm.sh/@google/genai@1.34.0"
      }
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
