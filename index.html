
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="./manifest.json">
    <title>Office Fund & Tender Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        #root:empty::before {
            content: "Initializing Nexus Core...";
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #6366f1;
            font-weight: 600;
            font-size: 1.1rem;
            background: #0f172a;
        }
    </style>
    <script>
      // Global error reporting for the boot phase
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT') {
          const root = document.getElementById('root');
          if (root && root.innerHTML === '') {
            root.innerHTML = '<div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0f172a; color:#ef4444; text-align:center; padding:20px; font-family: sans-serif;">' +
              '<i class="fa-solid fa-microchip" style="font-size:48px; margin-bottom:20px; color:#6366f1;"></i>' +
              '<h1 style="font-size:24px; font-weight:bold; margin-bottom:10px; color:white;">Nexus Boot Failed</h1>' +
              '<p style="color:#94a3b8; font-size:14px; max-width:400px; margin-bottom:20px;">The system could not load its core modules. This usually happens when running .tsx files directly in a browser without a build step.</p>' +
              '<div style="background:rgba(99,102,241,0.1); color:#818cf8; font-size:12px; border:1px solid rgba(99,102,241,0.3); padding:15px; border-radius:12px; text-align: left;">' +
              '<b>Next Steps:</b><br/>' +
              '1. Install <b>Node.js</b>.<br/>' +
              '2. Run <b>npm install</b> in this folder.<br/>' +
              '3. Run <b>npm run dev</b> to start locally.<br/>' +
              '4. Run <b>npm run build</b> to create a version for GitHub Pages.' +
              '</div>' +
              '</div>';
          }
        }
      }, true);

      window.process = { env: { API_KEY: '' } };
    </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
